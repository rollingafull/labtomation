---
# Monitor Proxmox node status

- name: Get node status
  command: pvesh get /nodes/{{ inventory_hostname }}/status
  register: node_status
  changed_when: false
  become: true

- name: Get running VMs
  command: qm list
  register: vm_list
  changed_when: false
  become: true

- name: Get running containers
  command: pct list
  register: ct_list
  changed_when: false
  failed_when: false
  become: true

- name: Display node information
  debug:
    msg:
      - "Node: {{ inventory_hostname }}"
      - "Status: Online"
      - "VMs: {{ vm_list.stdout_lines | length - 1 }}"
      - "Containers: {{ ct_list.stdout_lines | length - 1 if ct_list.rc == 0 else 0 }}"
