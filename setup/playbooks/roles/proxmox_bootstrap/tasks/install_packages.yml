---
# Install required packages on Proxmox node

- name: Install required packages (multi-distro)
  ansible.builtin.package:
    name: "{{ proxmox_required_packages }}"
    state: present

- name: Verify Python proxmoxer module
  ansible.builtin.command: python3 -c "import proxmoxer; print(proxmoxer.__version__)"
  register: proxmoxer_version
  changed_when: false
  failed_when: false

- name: Display proxmoxer version
  ansible.builtin.debug:
    msg: "✓ Python proxmoxer version: {{ proxmoxer_version.stdout }}"
  when: proxmoxer_version.rc == 0
