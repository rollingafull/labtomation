---
# Save credentials to Vault using hostname

- name: Get Vault token from AppRole
  ansible.builtin.command: >
    vault write -field=token auth/approle/login
    role_id="{{ vault_role_id }}"
    secret_id="{{ vault_secret_id }}"
  environment:
    VAULT_ADDR: "{{ vault_addr }}"
  register: vault_token_result
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true

- name: Set Vault token
  ansible.builtin.set_fact:
    vault_token: "{{ vault_token_result.stdout }}"
  no_log: true

- name: Save node credentials to Vault
  ansible.builtin.command: >
    vault kv put {{ vault_proxmox_nodes_path }}/{{ inventory_hostname }}
    api_token_id="{{ api_token_id }}"
    api_token_secret="{{ api_token_secret }}"
    hostname="{{ inventory_hostname }}"
    ip_address="{{ ansible_host }}"
    proxmox_version="{{ proxmox_version }}"
    role="{{ proxmox_role }}"
    {% if cluster_name is defined and cluster_name != 'none' %}cluster_name="{{ cluster_name }}"{% endif %}
    bootstrapped_at="{{ ansible_date_time.iso8601 }}"
  environment:
    VAULT_ADDR: "{{ vault_addr }}"
    VAULT_TOKEN: "{{ vault_token }}"
  delegate_to: localhost
  become: false
  no_log: true
  register: vault_save

- name: Verify credentials were saved
  ansible.builtin.command: "vault kv get {{ vault_proxmox_nodes_path }}/{{ inventory_hostname }}"
  environment:
    VAULT_ADDR: "{{ vault_addr }}"
    VAULT_TOKEN: "{{ vault_token }}"
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true
  register: vault_verify

- name: Display Vault save status
  ansible.builtin.debug:
    msg: "✓ Credentials saved to Vault: {{ vault_proxmox_nodes_path }}/{{ inventory_hostname }}"
