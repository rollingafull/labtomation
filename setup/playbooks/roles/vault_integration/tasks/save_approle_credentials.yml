---
# Save AppRole credentials securely

- name: Create Labtomation config directory
  ansible.builtin.file:
    path: "{{ vault_config_dir }}"
    state: directory
    mode: '0755'
  become: true

- name: Save AppRole credentials to file
  ansible.builtin.copy:
    content: |
      # Vault AppRole credentials for Ansible automation
      # DO NOT COMMIT THIS FILE TO VERSION CONTROL
      # Generated: {{ ansible_date_time.iso8601 }}

      VAULT_ADDR="{{ vault_addr }}"
      VAULT_ROLE_ID="{{ vault_role_id }}"
      VAULT_SECRET_ID="{{ vault_secret_id }}"
    dest: "{{ vault_approle_file }}"
    mode: '0600'
    owner: "{{ ansible_user_id }}"
  become: true
  no_log: true

- name: Create .env file for easy sourcing
  ansible.builtin.copy:
    content: |
      # Vault environment variables
      # Source this file before running Ansible playbooks:
      #   source {{ vault_env_file }}

      export VAULT_ADDR="{{ vault_addr }}"
      export VAULT_ROLE_ID="{{ vault_role_id }}"
      export VAULT_SECRET_ID="{{ vault_secret_id }}"
    dest: "{{ vault_env_file }}"
    mode: '0600'
    owner: "{{ ansible_user_id }}"
  become: true
  no_log: true

- name: Display credentials location
  ansible.builtin.debug:
    msg:
      - "✓ AppRole credentials saved to:"
      - "  - {{ vault_approle_file }}"
      - "  - {{ vault_env_file }}"
      - ""
      - "To use with Ansible:"
      - "  source {{ vault_env_file }}"
      - "  ansible-playbook playbook.yml"
