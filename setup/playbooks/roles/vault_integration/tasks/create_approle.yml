---
# Create AppRole for Ansible automation

- name: Check if AppRole already exists
  command: "vault read auth/approle/role/{{ vault_approle_name }}"
  environment:
    VAULT_ADDR: "{{ vault_addr }}"
    VAULT_TOKEN: "{{ vault_root_token }}"
  register: approle_check
  failed_when: false
  changed_when: false
  no_log: true

- name: Create AppRole
  command: >
    vault write auth/approle/role/{{ vault_approle_name }}
    token_policies="{{ vault_approle_policy_name }}"
    token_ttl="{{ vault_approle_token_ttl }}"
    token_max_ttl="{{ vault_approle_token_max_ttl }}"
    bind_secret_id="{{ vault_approle_bind_secret_id | lower }}"
    secret_id_ttl="{{ vault_approle_secret_id_ttl }}"
    secret_id_num_uses="{{ vault_approle_secret_id_num_uses }}"
  environment:
    VAULT_ADDR: "{{ vault_addr }}"
    VAULT_TOKEN: "{{ vault_root_token }}"
  when: approle_check.rc != 0
  register: approle_created
  no_log: true

- name: Get Role ID
  command: "vault read -field=role_id auth/approle/role/{{ vault_approle_name }}/role-id"
  environment:
    VAULT_ADDR: "{{ vault_addr }}"
    VAULT_TOKEN: "{{ vault_root_token }}"
  register: role_id_output
  changed_when: false
  no_log: true

- name: Get Secret ID
  command: "vault write -field=secret_id -f auth/approle/role/{{ vault_approle_name }}/secret-id"
  environment:
    VAULT_ADDR: "{{ vault_addr }}"
    VAULT_TOKEN: "{{ vault_root_token }}"
  register: secret_id_output
  changed_when: false
  no_log: true

- name: Set AppRole credentials
  set_fact:
    vault_role_id: "{{ role_id_output.stdout }}"
    vault_secret_id: "{{ secret_id_output.stdout }}"
  no_log: true

- name: Display AppRole status
  debug:
    msg: "{{ '✓ AppRole created successfully' if approle_created.changed else '✓ AppRole already exists' }}"
