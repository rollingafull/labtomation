---
# Create AppRole for Ansible automation

- name: Check if AppRole already exists
  ansible.builtin.command: "vault read auth/approle/role/{{ vault_approle_name }}"
  environment:
    VAULT_ADDR: "{{ vault_addr }}"
    VAULT_TOKEN: "{{ vault_root_token }}"
  register: approle_check
  failed_when: false
  changed_when: false
  no_log: false

- name: Debug AppRole check result
  ansible.builtin.debug:
    msg:
      - "AppRole check: rc={{ approle_check.rc }}"
      - "AppRole exists: {{ approle_check.rc == 0 }}"
      - "Will delete: {{ approle_check.rc == 0 }}"

- name: Delete existing AppRole (will be recreated with latest policy)
  ansible.builtin.command: "vault delete auth/approle/role/{{ vault_approle_name }}"
  environment:
    VAULT_ADDR: "{{ vault_addr }}"
    VAULT_TOKEN: "{{ vault_root_token }}"
  when: approle_check.rc == 0
  register: approle_deleted
  changed_when: true

- name: Display AppRole deletion status
  ansible.builtin.debug:
    msg: "→ AppRole deleted and will be recreated (policy was {{ 'updated' if existing_policy is defined and existing_policy.rc == 0 else 'created' }})"
  when: approle_deleted is defined and approle_deleted.changed

- name: Create or recreate AppRole with current policy
  ansible.builtin.command: >
    vault write auth/approle/role/{{ vault_approle_name }}
    token_policies="{{ vault_approle_policy_name }}"
    token_ttl="{{ vault_approle_token_ttl }}"
    token_max_ttl="{{ vault_approle_token_max_ttl }}"
    bind_secret_id="{{ vault_approle_bind_secret_id | lower }}"
    secret_id_ttl="{{ vault_approle_secret_id_ttl }}"
    secret_id_num_uses="{{ vault_approle_secret_id_num_uses }}"
  environment:
    VAULT_ADDR: "{{ vault_addr }}"
    VAULT_TOKEN: "{{ vault_root_token }}"
  register: approle_created
  changed_when: true
  no_log: true

- name: Get Role ID
  ansible.builtin.command: "vault read -field=role_id auth/approle/role/{{ vault_approle_name }}/role-id"
  environment:
    VAULT_ADDR: "{{ vault_addr }}"
    VAULT_TOKEN: "{{ vault_root_token }}"
  register: role_id_output
  changed_when: false
  no_log: true

- name: Get Secret ID
  ansible.builtin.command: "vault write -field=secret_id -f auth/approle/role/{{ vault_approle_name }}/secret-id"
  environment:
    VAULT_ADDR: "{{ vault_addr }}"
    VAULT_TOKEN: "{{ vault_root_token }}"
  register: secret_id_output
  changed_when: false
  no_log: true

- name: Set AppRole credentials
  ansible.builtin.set_fact:
    vault_role_id: "{{ role_id_output.stdout }}"
    vault_secret_id: "{{ secret_id_output.stdout }}"
  no_log: true

- name: Display AppRole status
  ansible.builtin.debug:
    msg: "✓ AppRole {{ 'recreated with updated policy' if (approle_deleted is defined and approle_deleted.changed) else 'created' }}"
