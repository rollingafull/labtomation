---
# Install required packages and collections

- name: Check if hvac is installed
  command: python3 -c "import hvac"
  register: hvac_check
  failed_when: false
  changed_when: false

- name: Check if requests is installed
  command: python3 -c "import requests"
  register: requests_check
  failed_when: false
  changed_when: false

# For Debian/Ubuntu: Use system packages
- name: Install Python packages via apt (Debian/Ubuntu)
  ansible.builtin.apt:
    name:
      - python3-hvac
      - python3-requests
    state: present
  become: true
  when:
    - ansible_os_family == "Debian"
    - hvac_check.rc != 0 or requests_check.rc != 0

# For RedHat/Rocky: Use pip with break-system-packages
- name: Install Python hvac module via pip (RedHat/Rocky)
  ansible.builtin.pip:
    name: hvac
    executable: pip3
    extra_args: --break-system-packages
  become: true
  when:
    - ansible_os_family == "RedHat"
    - hvac_check.rc != 0

- name: Install Python requests module via pip (RedHat/Rocky)
  ansible.builtin.pip:
    name: requests
    executable: pip3
    extra_args: --break-system-packages
  become: true
  when:
    - ansible_os_family == "RedHat"
    - requests_check.rc != 0

- name: Check installed Ansible collections
  command: ansible-galaxy collection list
  register: collections_list
  changed_when: false
  failed_when: false

- name: Install required Ansible collections
  command: "ansible-galaxy collection install {{ item }}"
  loop: "{{ vault_required_collections }}"
  when: item not in collections_list.stdout
  changed_when: true

- name: Verify hvac Python module
  command: python3 -c "import hvac; print(getattr(hvac, '__version__', 'installed'))"
  register: hvac_version
  changed_when: false
  failed_when: false

- name: Display hvac status
  debug:
    msg: "✓ Python hvac module: {{ hvac_version.stdout | default('installed') }}"
