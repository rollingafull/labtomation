---
# Create Ansible policy for Proxmox management

- name: Check if policy already exists
  ansible.builtin.command: "vault policy read {{ vault_approle_policy_name }}"
  environment:
    VAULT_ADDR: "{{ vault_addr }}"
    VAULT_TOKEN: "{{ vault_root_token }}"
  register: existing_policy
  changed_when: false
  failed_when: false
  no_log: true

- name: Check if existing policy has required permissions
  ansible.builtin.set_fact:
    policy_needs_update: >-
      {{
        existing_policy.rc != 0 or
        'lookup-self' not in existing_policy.stdout or
        'renew-self' not in existing_policy.stdout
      }}

- name: Display policy update status
  ansible.builtin.debug:
    msg: >-
      {{
        'Policy exists but needs update (missing token permissions)' if (existing_policy.rc == 0 and policy_needs_update | bool)
        else 'Policy does not exist, will create' if existing_policy.rc != 0
        else 'Policy exists with correct permissions'
      }}

- name: Create policy file from template
  ansible.builtin.template:
    src: ansible-proxmox-policy.hcl.j2
    dest: "/tmp/{{ vault_approle_policy_name }}.hcl"
    mode: '0600'
  when: policy_needs_update | bool

- name: Write policy to Vault (create or update)
  ansible.builtin.command: "vault policy write {{ vault_approle_policy_name }} /tmp/{{ vault_approle_policy_name }}.hcl"
  environment:
    VAULT_ADDR: "{{ vault_addr }}"
    VAULT_TOKEN: "{{ vault_root_token }}"
  register: policy_written
  changed_when: true
  when: policy_needs_update | bool

- name: Remove temporary policy file
  ansible.builtin.file:
    path: "/tmp/{{ vault_approle_policy_name }}.hcl"
    state: absent
  when: policy_needs_update | bool

- name: Verify policy is correct
  ansible.builtin.command: "vault policy read {{ vault_approle_policy_name }}"
  environment:
    VAULT_ADDR: "{{ vault_addr }}"
    VAULT_TOKEN: "{{ vault_root_token }}"
  register: policy_read
  changed_when: false
  no_log: true

- name: Display policy status
  ansible.builtin.debug:
    msg:
      - "✓ Policy '{{ vault_approle_policy_name }}' {{ 'updated' if (existing_policy.rc == 0 and policy_needs_update | bool) else 'created' if existing_policy.rc != 0 else 'verified' }}"
      - "{{ '  → Added token lookup-self and renew-self permissions' if (existing_policy.rc == 0 and policy_needs_update | bool) else '' }}"
