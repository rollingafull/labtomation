---
# Verify Vault integration is working

- name: Test AppRole login
  command: >
    vault write -field=token auth/approle/login
    role_id="{{ vault_role_id }}"
    secret_id="{{ vault_secret_id }}"
  environment:
    VAULT_ADDR: "{{ vault_addr }}"
  register: approle_login
  changed_when: false
  no_log: true

- name: Set AppRole token
  set_fact:
    approle_token: "{{ approle_login.stdout }}"
  no_log: true

- name: Test reading with AppRole token
  command: vault token lookup
  environment:
    VAULT_ADDR: "{{ vault_addr }}"
    VAULT_TOKEN: "{{ approle_token }}"
  register: token_test
  changed_when: false
  no_log: true

- name: Enable KV v2 secrets engine if not exists
  command: vault secrets list -format=json
  environment:
    VAULT_ADDR: "{{ vault_addr }}"
    VAULT_TOKEN: "{{ vault_root_token }}"
  register: secrets_engines
  changed_when: false
  no_log: true

- name: Parse secrets engines
  set_fact:
    secrets_list: "{{ secrets_engines.stdout | from_json }}"

- name: Enable KV v2 secrets engine
  command: vault secrets enable -version=2 -path=secret kv
  environment:
    VAULT_ADDR: "{{ vault_addr }}"
    VAULT_TOKEN: "{{ vault_root_token }}"
  when: "'secret/' not in secrets_list"
  register: kv_enabled
  no_log: true

- name: Test write capability
  command: >
    vault kv put secret/proxmox/test
    test_key="test_value"
    created_at="{{ ansible_date_time.iso8601 }}"
  environment:
    VAULT_ADDR: "{{ vault_addr }}"
    VAULT_TOKEN: "{{ approle_token }}"
  register: test_write
  changed_when: false
  no_log: true

- name: Test read capability
  command: vault kv get secret/proxmox/test
  environment:
    VAULT_ADDR: "{{ vault_addr }}"
    VAULT_TOKEN: "{{ approle_token }}"
  register: test_read
  changed_when: false
  no_log: true

- name: Delete test secret
  command: vault kv delete secret/proxmox/test
  environment:
    VAULT_ADDR: "{{ vault_addr }}"
    VAULT_TOKEN: "{{ approle_token }}"
  changed_when: false
  no_log: true

- name: Display verification results
  debug:
    msg: |

      ═══════════════════════════════════════════════════════════════
           Vault Integration Verification - SUCCESS
      ═══════════════════════════════════════════════════════════════

      ✓ AppRole authentication working
      ✓ Token generation successful
      ✓ Read permissions verified
      ✓ Write permissions verified
      ✓ Delete permissions verified

      Ansible is now ready to use Vault for secrets management

      ═══════════════════════════════════════════════════════════════
