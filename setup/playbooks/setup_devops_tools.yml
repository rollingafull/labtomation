---
# ===============================================================================
# Playbook: DevOps Tools Installation
# Description: Installs Terraform, HashiCorp Vault, and Jenkins on lab VMs
# -------------------------------------------------------------------------------
# Author: rolling (rolling@a-full.com)
# Created: 2025-10-22
# Version: 1.0.0
# ===============================================================================
#
# Usage:
#   # Install all tools
#   ansible-playbook setup_devops_tools.yml
#
#   # Install only Terraform
#   ansible-playbook setup_devops_tools.yml --tags terraform
#
#   # Install Terraform and Vault only
#   ansible-playbook setup_devops_tools.yml --tags terraform,vault
#
#   # Install all except Jenkins
#   ansible-playbook setup_devops_tools.yml --skip-tags jenkins
#
#   # Dry run (check mode)
#   ansible-playbook setup_devops_tools.yml --check
#
# ===============================================================================

- name: Setup DevOps Tools on Lab VM
  hosts: all
  become: true
  gather_facts: true

  pre_tasks:
    - name: Remove existing HashiCorp repository (if present from failed run)
      ansible.builtin.file:
        path: /etc/yum.repos.d/hashicorp.repo
        state: absent
      when: ansible_os_family == "RedHat"
      tags: [always]

  tasks:
    # Execute common role
    - name: Include common role
      ansible.builtin.include_role:
        name: common
      tags: [common, always]

    # Execute terraform role
    - name: Include terraform role
      ansible.builtin.include_role:
        name: terraform
      tags: [terraform, devops]

    # Execute vault role
    - name: Include vault role
      ansible.builtin.include_role:
        name: vault
      tags: [vault, devops]

    # Force handler execution to restart Vault service before initialization
    - name: Flush handlers to ensure Vault service is restarted
      ansible.builtin.meta: flush_handlers
      tags: [vault, vault_init, devops]

    # Execute vault_init role after Vault service is stable
    - name: Include vault_init role
      ansible.builtin.include_role:
        name: vault_init
      tags: [vault, vault_init, devops]

    # Execute jenkins role
    - name: Include jenkins role
      ansible.builtin.include_role:
        name: jenkins
      tags: [jenkins, devops, optional]
      when: install_jenkins | default(false) | bool

  post_tasks:
    - name: Display installation summary
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "✅ DevOps Tools Installation Complete"
          - "=========================================="
          - "Installed tools can be verified with:"
          - "  terraform version"
          - "  vault version"
          - "  vault status"
          - "  systemctl status jenkins  # if installed"
          - ""
          - "Vault has been initialized and configured"
          - "Credentials stored in: /home/labtomation/.security/.vault"
          - "Environment file: /home/labtomation/.security/.vault_env.sh"
          - ""
          - "To use Vault CLI:"
          - "  source /home/labtomation/.security/.vault_env.sh"
          - "=========================================="
      tags: [always]
